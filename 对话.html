<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="对话">
<title>范思静 · 对话</title>
<style>
:root{--bg:#f5f1e8;--card:#fdfcf8;--border:#d4cbb8;--text:#2c2416;--muted:#8c8272;--accent:#5b4c3a;--me:#5b4c3a;--them:#ede8df}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;height:100vh;-webkit-tap-highlight-color:transparent}

/* header */
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.bar .dot{width:8px;height:8px;background:#16a34a;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.bar h1{font-size:15px;font-weight:600;color:var(--text)}
.bar .sub{font-size:11px;color:var(--muted)}

/* chat */
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.6;word-break:break-word}
.msg.them{align-self:flex-start;background:var(--them);color:var(--text);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--me);color:#fdfcf8;border-bottom-right-radius:4px}

/* input */
.bottom{flex-shrink:0;padding:10px 12px 16px;background:var(--card);border-top:1px solid var(--border)}
.input-row{display:flex;gap:8px}
.input-row textarea{flex:1;min-height:44px;max-height:100px;background:#fff;border:2px solid var(--border);border-radius:10px;padding:10px 14px;font-size:15px;font-family:inherit;resize:none;outline:none;-webkit-appearance:none;line-height:1.5}
.input-row textarea:focus{border-color:var(--accent)}
.input-row textarea::placeholder{color:var(--muted)}
.btn-send{flex-shrink:0;padding:10px 18px;border-radius:10px;border:none;background:var(--accent);color:#fdfcf8;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;-webkit-appearance:none;transition:.15s}
.btn-send:active{transform:scale(.96)}

.bottom-hint{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.bottom-hint span{font-size:10px;color:var(--muted)}
.bottom-hint button{font-size:10px;color:var(--accent);background:none;border:none;cursor:pointer;text-decoration:underline}

/* empty state */
.empty{text-align:center;padding:40px 20px}
.empty .big{font-size:40px;margin-bottom:12px}
.empty p{font-size:14px;color:var(--muted);line-height:1.7}

.save-dot{display:inline-block;font-size:10px;color:#16a34a;margin-left:4px;opacity:0;transition:opacity .3s}
.save-dot.show{opacity:1}

@media(min-width:600px){.container{max-width:720px;margin:0 auto;height:100vh;display:flex;flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<div class="bar"><span class="dot"></span><div><h1>对话助手</h1><div class="sub">打字即存 · 关掉回来还在</div></div></div>

<div class="chat" id="chat">
  <div class="empty"><div class="big">💬</div><p>在这里写下你想问的<br>手机电脑都能打开<br>同一个网址</p></div>
</div>

<div class="bottom">
  <div class="input-row">
    <textarea id="ta" placeholder="写下你想问的..." rows="1" oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
    <button class="btn-send" onclick="send()">发送</button>
  </div>
  <div class="bottom-hint">
    <span id="saveHint">本地保存</span>
    <button onclick="copyAll()">📋 复制全部</button>
  </div>
</div>
</div>

<script>
var KEY = 'chat_history_v1';

function load(){
  try{
    var msgs = JSON.parse(localStorage.getItem(KEY) || '[]');
    if(msgs.length===0) return;
    document.getElementById('chat').innerHTML = '';
    msgs.forEach(function(m){ addBubble(m.type, m.text); });
    scrollDown();
  }catch(e){}
}

function save(){
  var msgs = [];
  document.querySelectorAll('#chat .msg').forEach(function(el){
    if(el.classList.contains('me')) msgs.push({type:'me',text:el.textContent});
    else if(el.classList.contains('them')) msgs.push({type:'them',text:el.textContent});
  });
  localStorage.setItem(KEY, JSON.stringify(msgs));
  var dot = document.getElementById('saveHint');
  dot.textContent='● 已保存';dot.style.color='#16a34a';
  setTimeout(function(){dot.textContent='本地保存';dot.style.color='';},1200);
}

function addBubble(type, text){
  var d = document.getElementById('chat');
  // remove empty state
  var empty = d.querySelector('.empty');
  if(empty) empty.remove();

  var div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  d.appendChild(div);
}

function send(){
  var ta = document.getElementById('ta');
  var text = ta.value.trim();
  if(!text) return;
  addBubble('me', text);
  ta.value = ''; ta.style.height = '';
  save(); scrollDown();

  // Simulated reply
  setTimeout(function(){
    addBubble('them', '已收到。把这段话复制到 Claude Code 或 claude.ai，我来回复你。');
    save(); scrollDown();
  }, 800);
}

function scrollDown(){
  var c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}

function copyAll(){
  var msgs = [];
  document.querySelectorAll('#chat .msg').forEach(function(el){
    msgs.push((el.classList.contains('me')?'我':'对方')+': '+el.textContent);
  });
  if(msgs.length===0){alert('还没有对话');return;}
  navigator.clipboard.writeText(msgs.join('\n')).then(function(){
    var dot = document.getElementById('saveHint');
    dot.textContent='✅ 已复制全部对话';dot.style.color='#16a34a';
    setTimeout(function(){dot.textContent='本地保存';dot.style.color='';},1500);
  });
}

// Enter to send
document.getElementById('ta').addEventListener('keydown',function(e){
  if(e.key==='Enter' && !e.shiftKey){e.preventDefault();send();}
});

load();
document.getElementById('ta').focus();
</script>
</body>
</html>
