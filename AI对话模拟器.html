<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>AI对话模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f1f5f9;color:#1e293b;min-height:100vh;
  line-height:1.6;padding:14px;
  -webkit-tap-highlight-color:transparent;
}
.container{max-width:720px;margin:0 auto}

/* ---- Top bar ---- */
.topbar{
  background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(0,0,0,0.03);border:1px solid #e2e8f0;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.topbar h1{font-size:18px;font-weight:800;color:#0f172a}
.topbar .badge{font-size:11px;background:#2563eb;color:#fff;padding:3px 10px;border-radius:20px;font-weight:700}

/* ---- Persona selector ---- */
.personas{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.persona{
  flex-shrink:0;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;
  border:2px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer;
  transition:.15s;white-space:nowrap;min-height:48px;display:flex;align-items:center;gap:8px;
}
.persona:hover{border-color:#93c5fd}
.persona.active{background:#2563eb;color:#fff;border-color:#2563eb}
.persona .p-emoji{font-size:20px}

/* ---- Scenario picker ---- */
.scenarios{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.scen{
  padding:8px 14px;border-radius:8px;font-size:12px;font-weight:500;
  border:1.5px solid #e2e8f0;background:#fff;color:#475569;cursor:pointer;
  transition:.15s;min-height:40px;display:flex;align-items:center;
}
.scen:hover{border-color:#93c5fd}
.scen.active{background:#eff6ff;color:#2563eb;border-color:#2563eb;font-weight:700}

/* ---- Chat area ---- */
.chat{
  background:#fff;border-radius:14px;padding:20px 16px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(0,0,0,0.03);border:1px solid #e2e8f0;
  min-height:300px;max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;
}

.msg{max-width:85%;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;animation:fadeIn .3s}
.msg.them{align-self:flex-start;background:#f1f5f9;color:#1e293b;border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:4px}
.msg.coach{align-self:stretch;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;font-size:12px;color:#92400e}
.msg .who{font-size:10px;font-weight:700;letter-spacing:.5px;margin-bottom:4px;opacity:.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* Coach tips */
.coach-tip{margin-top:4px;font-size:11px}
.coach-tip .good{color:#16a34a}
.coach-tip .improve{color:#d97706}

/* ---- Input area ---- */
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-row textarea{
  flex:1;min-height:52px;max-height:100px;background:#fff;border:2px solid #cbd5e1;
  border-radius:10px;color:#1e293b;padding:12px 14px;font-size:15px;line-height:1.5;
  font-family:inherit;resize:none;-webkit-appearance:none;
}
.input-row textarea:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.input-row textarea::placeholder{color:#94a3b8}
.btn-send{
  flex-shrink:0;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:700;
  border:none;cursor:pointer;background:#2563eb;color:#fff;min-height:52px;
  -webkit-appearance:none;transition:.15s;
}
.btn-send:active{transform:scale(.96)}
.btn-reset{
  flex-shrink:0;padding:12px 16px;border-radius:10px;font-size:12px;font-weight:600;
  border:2px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer;min-height:52px;
  -webkit-appearance:none;
}
.btn-enter{background:#f1f5f9;border:1px solid #e2e8f0;color:#64748b;width:100%;padding:10px;border-radius:8px;font-size:13px;cursor:pointer;margin-top:8px;min-height:44px;-webkit-appearance:none}

@media(max-width:500px){
  body{padding:8px}
  .msg{font-size:13px;padding:10px 14px}
  .input-row textarea{font-size:16px}
}
</style>
</head>
<body>
<div class="container">
<div class="topbar"><h1>AI对话模拟器</h1><span class="badge" id="roundBadge">选身份开始</span></div>

<div class="personas" id="personas"></div>
<div class="scenarios" id="scenarios"></div>
<div class="chat" id="chat"></div>
<div class="input-row" id="inputArea">
  <textarea id="userInput" placeholder="选择一个身份和场景，AI会先开口..." rows="1" disabled></textarea>
  <button class="btn-send" id="sendBtn" disabled onclick="send()">发送</button>
</div>
</div>

<script>
// =========== PERSONAS & SCENARIOS ===========
const personas = {
  interviewer: {
    name: '面试官·业务负责人',
    emoji: '🎯',
    tone: '你是一位在信息流行业深耕8年的业务负责人。你面试过200+候选人，从执行到总监都面过。你精通千川投放、全域推广、素材策略、团队管理。你的面试风格是"剥洋葱"——先问表面，再追问细节，直到看到对方真实的思考深度。你不会接受任何模糊回答。你会追问：①具体数据（"ROI从多少到多少"）②决策逻辑（"为什么选A不选B"）③自我复盘（"如果重来你怎么做"）。你能识别出"碰巧做出爆款的人"和"有方法论的人"之间的区别。你关注的核心素质：数据诊断能力、策略框架思维、管理可复制性。',
    scenarios: [
      { id:'i1', name:'项目深挖·渍无踪', start:'你好。面试进行到现在，我想深挖一个项目。你简历上写渍无踪从3个月没起量做到月销千万——这个跨度很大，但跨度大不代表能力强。我想知道的是：你接手时看到的第一组数据是什么？你当时脑子里做了什么判断？为什么你能看到别人没看到的东西？从头讲。' },
      { id:'i2', name:'数据诊断力', start:'我换一种方式问。假设现在给你看一组数据——月消耗连续3个月下降（68万→41万→19万），ROI从1.55降到1.32，但过审率95%、转化率其实没跌多少。你觉得问题出在哪？不需要你给出正确答案，我想听你的思考过程。一步一步来。' },
      { id:'i3', name:'管理资历质疑', start:'我们聊了业务部分，现在聊聊管理。你只有1年多的管理经验，带的是3人小组。我们这个岗位要管8-10人的内容团队。抛开简历上写的，你真实的顾虑是什么？你觉得1年管3人的经验，有多少能迁移到管8个人？我不接受"我都会努力做好"这种回答。' },
      { id:'i4', name:'策略框架能力', start:'最后一个问题。你在三个品类都做出过成绩——大健康、女装、家清。如果你要教一个完全零经验的新人——他从来没做过信息流——你会给他一个什么样的框架，让他在3个月内能独立产出合格的素材？不要讲大道理，给我一个可以落地执行的框架。' },
    ]
  },
  brand: {
    name: '品牌方·电商负责人',
    emoji: '🏢',
    tone: '你是一个操盘过年GMV 5000万+家清品牌的电商负责人。你对千川投放不是小白——你自己也看过数据、调过计划。你找代理不是为了"甩手掌柜"，你要的是"比你自己投效果更好"的专业操盘手。你对数据敏感：消耗、ROI、CPM、完播率、GPM你都懂。你的核心关切：①钱花得值不值②增长是不是可持续③遇到问题响应快不快。你欣赏诚实和专业，讨厌找借口和甩锅。',
    scenarios: [
      { id:'b1', name:'月度汇报·增长质量', start:'月报我看了，消耗涨了60%，GMV涨了67%——表面上挺好的。但我有个习惯：看增长不看总量、看质量。你把这个增长拆解给我听：多少是加大预算砸出来的，多少是内容效率真正提升了？我怎么确定下个月还能维持这个增长？' },
      { id:'b2', name:'审核危机·618大促', start:'刚被通知我们除菌洗衣液的材料大量被驳回——后天618大促就开始了。你现在别说"我们会处理"这种话。我要听的是：①现在的消耗影响有多大②你是怎么跟平台沟通的③替代方案什么时候能上④大促会不会受影响。一个一个说。' },
      { id:'b3', name:'竞品对比·ROI差距', start:'我上周末花时间看了竞品XX的直播间和短视频。他们的ROI做到1.9了，我们1.7。同样品类、同样平台、甚至客单价都差不多。你帮我分析一下这0.2的差距从哪来的——别说是"他们运气好"。还有，你觉得我们能不能追上？追不上的话为什么？' },
    ]
  },
  boss: {
    name: '老板·公司决策者',
    emoji: '💼',
    tone: '你是一家年营收5000万+代理公司的老板。你从一线做起，拍过视频、投过千川、也管过20人团队。现在你主要管战略和资源分配。你的时间很宝贵——每次沟通不超过15分钟。你需要下属用"结论+数据+风险"的结构跟你汇报。你看人不看学历看战斗力，但你非常在意"这个人能不能帮我分担压力，还是给我制造更多问题"。',
    scenarios: [
      { id:'c1', name:'申请预算', start:'你说想把月预算从30万加到50万。30秒内跟我说清楚三件事：多出来的20万能多赚多少、你有多大把握、如果赚不回来最坏情况是什么。开始。' },
      { id:'c2', name:'人才评估', start:'你说你组员能接组长。我关心的不是"能不能"，是"什么时候能"和"有什么风险"。她接管后你需要盯多久？如果前两周数据掉10%以上你怎么处理？我不要"我相信她"——我要具体方案。' },
      { id:'c3', name:'裁员决策', start:'公司要做组织优化，你们组要减一个人。这不是演习——你需要在周五前给我方案。我关心的是：你选的依据是什么、对业务的短期影响、你的过渡计划。不要说"他们都很好我选不出来"——你是管理者，做难的决定是你的工作。' },
    ]
  },
  team: {
    name: '下属·新人编导',
    emoji: '👥',
    tone: '你是一个刚入行3个月的编导。你有热情但经验不足。你的组长（就是对方）对你有要求——拍摄标准、脚本规范、数据追踪——你都还在学。你有时候不太确定自己做得对不对、不太敢自己做判断。但你很认真，每次反馈你都会记下来，下次注意。',
    scenarios: [
      { id:'t1', name:'数据不好·不知道原因', start:'组长，我上周拍的那5条视频数据出来了——2条还好，3条不太行。但我不确定是脚本的问题还是拍摄的问题，也不知道从哪里开始分析。你能教我怎么自己看数据判断吗？我不想每次都靠你帮我看。' },
      { id:'t2', name:'审核驳回·慌了', start:'组长对不起！我提交的时候不小心把两条带"深层清洁、强力去污"这种说法的视频交上去了，被驳回了。我对不起，我现在该怎么办？账号会不会受影响？我要不要先把今天的素材全撤回来？' },
      { id:'t3', name:'自我怀疑', start:'组长，我能问一个可能不太专业的问题吗...你觉得内容这个方向，天赋重要还是努力重要？我看了很多爆款视频，感觉人家的创意和节奏感是天生的。我不知道我再努力多久才能达到那个水平，有时候会有点怀疑自己适不适合做这行。' },
    ]
  },
  hr: {
    name: 'HR·资深招聘',
    emoji: '🤝',
    tone: '你是一个在互联网/电商行业做了7年招聘的HR。你面过从实习生到VP的上千人，offer谈过不下500个。你不只看薪资，更关注"这个人要什么""他能不能留下来""他的成长潜力如何"。你对市场薪资水平了如指掌——信息流主管在广州的市场价是12K-20K，15K是分水岭。你的谈判风格是"先听对方报价、再看匹配度、最后用公司的优势来谈整体package"。',
    scenarios: [
      { id:'h1', name:'谈期望', start:'面试反馈下来了——业务面试官对你的评价很高，特别是数据分析和项目操盘能力。我们进入谈offer阶段。先聊聊你目前的薪资和期望吧——方便透露上一份实际到手是多少吗？以及你对下一份的期望范围？' },
      { id:'h2', name:'学历压价', start:'业务面试对你的能力没有任何疑问。但谈薪资的时候我需要跟你坦诚：我们公司的薪资结构里，主管级别通常要求本科及以上学历。你这个专科学历，HR这边确实要做特殊申请。如果给你15K你能接受吗？我希望听到你真实的想法——如果你觉得少了，我希望你告诉我为什么。' },
      { id:'h3', name:'多offer', start:'你说你手上有别的offer——这很好，有竞争力说明市场认可你。我想了解一下那个offer的大致范围（不用精确数字），以及你目前更倾向哪边？我希望我们能坦诚沟通——如果你更倾向那边，也没关系，我们可以看看有没有调整的空间。' },
    ]
  }
};

let currentPersona = 'interviewer';
let currentScenario = 'i1';
let round = 0;
let chatHistory = [];

// =========== INIT ===========
function init() {
  document.getElementById('personas').innerHTML = Object.entries(personas).map(([k,v]) =>
    `<button class="persona${k===currentPersona?' active':''}" onclick="selectPersona(event,'${k}')">
      <span class="p-emoji">${v.emoji}</span>${v.name}
    </button>`
  ).join('');
  renderScenarios();
  startChat();
}

function selectPersona(ev, key) {
  currentPersona = key;
  var p = personas[key];
  currentScenario = p.scenarios[0].id;
  round = 0;
  chatHistory = [];
  document.querySelectorAll('.persona').forEach(function(el){ el.classList.remove('active'); });
  if (ev && ev.target) {
    var btn = ev.target.closest('.persona');
    if (btn) btn.classList.add('active');
    else document.querySelector('.persona').classList.add('active');
  }
  renderScenarios();
  startChat();
}

function selectScenario(ev, id) {
  currentScenario = id;
  round = 0;
  chatHistory = [];
  document.querySelectorAll('.scen').forEach(function(el){ el.classList.remove('active'); });
  if (ev && ev.target) ev.target.classList.add('active');
  startChat();
}

function renderScenarios() {
  var p = personas[currentPersona];
  document.getElementById('scenarios').innerHTML = p.scenarios.map(function(s){
    return `<button class="scen${s.id===currentScenario?' active':''}" onclick="selectScenario(event,'${s.id}')">${s.name}</button>`;
  }).join('');
}

// =========== CHAT ENGINE ===========
function startChat() {
  const p = personas[currentPersona];
  const s = p.scenarios.find(s => s.id === currentScenario);
  round = 0;
  chatHistory = [];

  document.getElementById('chat').innerHTML = '';
  document.getElementById('roundBadge').textContent = p.emoji + ' ' + p.name;
  document.getElementById('userInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('userInput').placeholder = '输入你的回答...';
  document.getElementById('userInput').focus();

  addMessage('them', s.start, p.name);
}

function send() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  addMessage('me', text, '我');
  input.value = '';
  round++;

  const response = generateResponse(text, round);

  setTimeout(() => {
    addMessage('them', response.text, personas[currentPersona].name);
    if (response.coach) {
      setTimeout(() => addCoachMessage(response.coach), 400);
    }
    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
  }, 600 + Math.random() * 400);
}

function generateResponse(userText, roundNum) {
  const p = personas[currentPersona];
  const sId = currentScenario;

  // Build responses based on persona + scenario + round
  const responses = getResponseMap();
  const key = `${sId}-r${roundNum}`;

  if (responses[key]) return responses[key];

  // Generic follow-up for rounds beyond predefined
  if (roundNum >= 4) {
    return {
      text: '好的，聊得差不多了。感谢你的时间。你还有什么想问我的吗？',
      coach: { good:'对话自然收尾。', improve:'可以在结束时主动提1-2个反问，展现你的思考和主动性。' }
    };
  }

  // Fallback
  const fallbacks = {
    interviewer: '嗯，有意思。那你觉得在这个过程中，如果让你重新做一次，你会改变什么？',
    brand: '我理解你的意思了。那接下来一个月，你准备怎么具体做？',
    boss: '好，这些我都听到了。那你需要我做什么样的决策或者给什么样的资源？',
    team: '谢谢组长，我大概明白了。那我先按你说的试试，有问题再来问你。',
    hr: '好的，我了解了。我会内部沟通一下，这两天给你回复。'
  };

  return { text: fallbacks[currentPersona] || '请继续。' };
}

function getResponseMap() {
  const map = {};

  // ===== INTERVIEWER =====
  map['i1-r1'] = {
    text: '有意思——你关注到了过审率和CPM，做出了"不是审核不是人群"的判断。但我要追问你：你说素材成片数从320降到85是根因。为什么你认为是产能问题而不是质量问题？万一是团队拍了320条垃圾素材、后来集中精力拍了85条精品呢？你怎么排除这个可能性？',
    coach: { good:'你在用诊断框架回应，逻辑清晰——先排除审核、再排除人群、最后定位素材。方向对了。', improve:'但对方现在追问的是"产能和质量的区分"。这个问题的关键词是完播率——如果85条是精品，完播率应该上升而不是从42%跌到28%。产能和质量的同步下降才是真正的证据。用"完播率也在跌"这个交叉验证来推翻"可能在做精品"的假设。' }
  };
  map['i1-r2'] = {
    text: '好，你找到了墨水渍方向。我想听的是——你怎么知道这个方向不是在碰运气？如果我换一个品类，没有"墨水渍"这种显性的爆点可以蹭，你怎么系统性地找到第一个起量方向？能给我一个方法论框架吗，而不是讲案例。',
    coach: { good:'你说对了——完播率也在跌=不可能是精品策略。对方认可了你的诊断。', improve:'现在他要的不是案例，是方法论。可以讲你的脚本分层测试机制（框架→痛点→元素→裂变），或者讲你的三步法：竞品TOP100拆框架→5方向×3版本矩阵测试→72小时数据淘汰。方法论=可复制，案例=不可复制。面试官要的是前者。' }
  };
  map['i1-r3'] = {
    text: '你讲的方法论框架让我觉得你确实有一套自己的体系。最后一个问题：这个产品现在不是你负责了，如果你培养的组长来问你"这个月消耗掉了30%，我怎么办"，你会在电话里问她哪三个问题？——注意，你不能帮她看数据，你只能通过提问帮她找到问题。',

function addMessage(type, text, who) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (who && type === 'them') div.innerHTML = `<div class="who">${who}</div>${text}`;
  else div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  chatHistory.push({ type, text, who });
}

function addCoachMessage(coach) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg coach';
  div.innerHTML = `
    <div class="who">🎓 对话教练</div>
    <div class="coach-tip"><span class="good">✅ 做得好的：</span>${coach.good}</div>
    <div class="coach-tip"><span class="improve">💡 还可以更好：</span>${coach.improve}</div>
  `;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// Enter key to send
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey && document.activeElement === document.getElementById('userInput')) {
    e.preventDefault();
    send();
  }
});
