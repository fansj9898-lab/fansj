function switchTpl(idx){
  document.querySelectorAll('.tpl-btn').forEach(function(b,i){b.classList.toggle('active',i===idx)});
  document.getElementById('template-css').textContent = templates[idx].css;
  localStorage.setItem('resume_tpl', idx);
}
