<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>话术健身房 · 信息流运营</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0e17; color: #d1d5db; min-height: 100vh; padding: 24px;
    line-height: 1.6;
  }
  .container { max-width: 780px; margin: 0 auto; }
  h1 { text-align: center; font-size: 22px; color: #f9fafb; margin-bottom: 4px; }
  .sub { text-align: center; font-size: 13px; color: #6b7280; margin-bottom: 24px; }

  .drill-card {
    background: #111827; border: 1px solid #1f2937; border-radius: 12px;
    padding: 28px; margin-bottom: 16px;
  }
  .drill-card .num { font-size: 11px; color: #2563eb; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
  .drill-card h3 { font-size: 16px; color: #f9fafb; margin-bottom: 6px; }
  .drill-card .prompt { font-size: 13px; color: #9ca3af; margin-bottom: 16px; }

  textarea {
    width: 100%; background: #0a0e17; border: 1px solid #1f2937; border-radius: 8px;
    color: #d1d5db; padding: 14px; font-size: 13px; line-height: 1.7;
    resize: vertical; min-height: 100px; font-family: inherit;
  }
  textarea:focus { outline: none; border-color: #2563eb; }

  .btn {
    padding: 10px 22px; border-radius: 8px; font-size: 13px; font-weight: 700;
    border: none; cursor: pointer; transition: 0.15s;
  }
  .btn-primary { background: #2563eb; color: #fff; margin-top: 10px; }
  .btn-primary:hover { background: #1d4ed8; }

  .result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid #1f2937; }

  .version {
    border-radius: 8px; padding: 16px; margin-bottom: 10px; font-size: 12px; line-height: 1.7;
  }
  .version .v-label {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px;
  }
  .version.v1 { background: #1a1f2e; border: 1px solid #374151; }
  .version.v1 .v-label { color: #60a5fa; }
  .version.v2 { background: #0a1628; border: 1px solid #1e3a5f; }
  .version.v2 .v-label { color: #f59e0b; }
  .version.v3 { background: #1a0a0a; border: 1px solid #451a1a; }
  .version.v3 .v-label { color: #f87171; }

  .diff {
    margin-top: 10px; padding: 10px 14px; background: #0a0e17; border-radius: 6px;
    font-size: 11px; color: #6b7280;
  }
  .diff strong { color: #9ca3af; }
</style>
</head>
<body>
<div class="container">
  <h1>话术健身房</h1>
  <div class="sub">写下你的版本 → 对照三个层级的优化版本 → 看到"从能说到说好"的差距</div>
  <div id="drills"></div>
</div>

<script>
const drills = [
  {
    num: 1,
    title: '"你做过的最大项目是什么？" — 1分钟版本',
    prompt: '面试官让你用1分钟讲渍无踪项目。请写下你现在会怎么讲。写完后对照三个优化版本。',
    v1: {
      label: 'V1 基础版（有逻辑，但像报数据）',
      text: '"我做过最大的项目是渍无踪去渍啫喱。这个产品在我接手时已经3个月没起量了。我做了三件事：第一，把投放从标准切换到了全域，拓展了流量来源；第二，研发了墨水渍系列视频，找到了爆点；第三，拓展了多种内容形式，不再局限于单一展示。最终的结果是峰值月消耗突破300万，月销售突破千万。这个产品稳定了半年，然后我把组员提拔为组长，去带了新品。"'
    },
    v2: {
      label: 'V2 进阶版（有画面，有"为什么是我"）',
      text: '"我最大的项目是把一个濒死的产品做到月销千万——渍无踪去渍啫喱。我接手的时候，团队已经放弃它了——3个月没起量，品牌方在缩减预算。但我在数据里发现了一个信号：过审率一直很高，说明不是审核的问题；CPM涨幅正常，说明不是人群的问题。问题在素材——我们没给系统足够的弹药去探索新人群。所以我推动了三件事：换投放模式、找新内容方向、建素材生产体系。结果是峰值月耗300万，持续稳定。我觉得这个项目的价值不只是数字——它证明了我知道"一个不起量的产品该怎么诊断、怎么制定策略、怎么落地执行"。"'
    },
    v3: {
      label: 'V3 面试级（有叙事钩子+有方法论+有记忆点）',
      text: '"我给你讲一个'产品复活'的故事。去年我接手了一个去渍啫喱产品，当时的状态是——连续3个月没起量，月消耗不到20万，团队内部已经判了死刑。我看了一圈数据，发现一个很有意思的细节：它的过审率有97%，CPM也在正常范围。这就很奇怪了——不是审核卡住了，也不贵，那为什么跑不动？后来我发现了一个数据：素材成片数从320条掉到了85条——产能腰斩了。这个产品的问题不是'跑不动'，是'没得跑'。所以我做了三件事：先重建素材生产体系把产能拉回来，同时快速测试新内容方向——我研究了一下同品类的爆款，发现'墨水渍'这个痛点是蓝海，就率先拍了墨水渍系列。找到方向之后再切换全域投放，把流量池扩大。结果是什么？峰值月消耗300万，月销千万，稳定了半年。产品稳定之后，我把组员培养成了组长——这个产品现在不是我在跑，但我建立的那套素材生产+方向测试+复盘体系还在用。"'
    },
    diff: '三个版本的差距在哪？V1在"报告数据"，像一个投手在汇报。V2加了一个叙事钩子（"团队已经判了死刑"→"我发现了一个细节"→"结果证明我对了"），有了起承转合。V3加了"这个产品现在不是我在跑"——这证明你的价值超越了"一个人能干"，变成"组织能力"。面试官听完V3会记住三样东西：数据（300万/千万）、方法论（诊断→策略→落地）、价值（可复制）。'
  },
  {
    num: 2,
    title: '"你的管理经验才1年多，凭什么管团队？"',
    prompt: '写下你现在的回答，然后对照升级版本。',
    v1: {
      label: 'V1 防御式（被问题带着走）',
      text: '"确实我管理经验只有一年多，但我带组的这段时间产出还不错——剪辑效率提升了62.5%，组员也被提拔了。我觉得结果可以证明我的管理能力。"'
    },
    v2: {
      label: 'V2 重构式（重新定义问题）',
      text: '"与其说我只管了1年多，不如说我经历了一个完整的管理闭环——从0建组。这不是"接盘一个成熟团队然后维护了一年"，而是"没有现成的流程、没有人带、从定方向到搭SOP到培养人到出成果"——全部自己来。我走完了从建组→规范化→放量→培养接班人的完整周期。这个过程的密度，可能比在一个成熟体系里管3年更高——因为每一步都是自己踩出来的。"'
    },
    v3: {
      label: 'V3 证据式（用对方的逻辑推翻对方的质疑）',
      text: '"这个问题特别好——因为我自己也想过。我后来复盘的时候发现，管理的核心不是'管了多少人'或者'管了多久'，而是'你能不能把个人经验变成团队标准'。我做了三件事来验证这个判断：第一，我建了素材生产SOP——以前靠我盯着大家拍，后来照着SOP就能产出合格素材，剪辑效率提升了62.5%。第二，我写了培训白皮书——新人来了不用从头教，按白皮书就能上手。第三，我把组员培养成了组长——她现在已经独立带组了。如果我的管理只是'盯着干活'，我不可能把一个人培养到我这个位置。所以管理经验不在年限，在'你的方法能不能复制'。"'
    },
    diff: 'V1的回应等于承认了"资历不够"——面试官听到的关键词是"确实"和"只有一年多"，然后他就不听后面的了。V2的回应重新定义了"经验"——把讨论从"时长的比较"转换到"密度的比较"。V3更进一步——它不直接回答"凭什么"，而是先拆解"管理的本质是什么"，然后用三个具体证据证明你做到了。面试官听完V3不会记得"1年"，只会记得"SOP、白皮书、培养组长"三个证据。'
  },
  {
    num: 3,
    title: '"你做的都是家清品类，到我们这能做吗？"',
    prompt: '面试官质疑你的品类经验不够。你怎么办？',
    v1: {
      label: 'V1 套话式',
      text: '"虽然我之前主要做家清，但我学习能力很强，之前从大健康转到女装再转到家清，每次新品类我都能快速上手并交出成果。所以我有信心在新品类也能做好。"'
    },
    v2: {
      label: 'V2 框架式（展示方法论而非经历）',
      text: '"品类不一样，但内容的方法论是一样的。我做的不是一个品类的专家，是'信息流内容起量'的方法论。无论在哪个品类，我需要做的都是同一件事：1周内拆完竞品TOP100内容框架→找到3-5个测试方向→72小时内看数据决定主攻方向。品类可以变，这套方法不变。我在三个品类里验证过这套方法——大健康、女装、家清，每个都交出了可量化的结果。"'
    },
    v3: {
      label: 'V3 反击式（把品类差异变成优势）',
      text: '"跨品类恰恰是我的优势，不是劣势。如果一个人只做过一个品类，你其实不知道他的能力是'品类的功劳'还是'他本人的功劳'。我横跨三个品类都交出了量化结果——大健康的搜索率+15%、女装的爆款率35%+、家清的月销千万——这恰恰证明了我的方法论是可以跨品类迁移的，不是绑定在某个品类上的运气。你招一个只做过一个品类的人，你要冒的风险是'万一到这个品类他不灵了呢'。你招我，你已经看到我在三个品类里都灵。这其实是降低了你的风险。"'
    },
    diff: 'V1是典型的"套话"——面试官听过无数次"我学习能力强"，没有说服力。V2开始展示方法论——把品类差异的讨论，转化为方法论验证的讨论。V3是最强的——它把"跨品类"这个看似劣势的事实，重新定义为"跨品类验证=风险更低"的优势。最高级的回应不是防御式辩解，而是重新定义问题的框架。'
  },
  {
    num: 4,
    title: '"说说你最近一次数据分析的案例"',
    prompt: '面试官想看你"数据驱动决策"的真实案例。写一个你最近分析数据的例子。',
    v1: {
      label: 'V1 数据列举式',
      text: '"我每周都会看数据。比如最近一周，消耗从42万降到28万，GMV从72万降到46万，ROI从1.70降到1.63。我发现是素材的5秒完播率从48%降到了32%，但转化率没变。所以判断是素材疲劳，需要换新方向。"'
    },
    v2: {
      label: 'V2 诊断框架式（展示思考过程）',
      text: '"我最近在做一个素材衰减的诊断。问题是消耗一周内降了34%，品牌方有点急。我先排除了两个可能性：不是人群问题（转化率没变，如果是人群问题转化率也会降），也不是审核问题（过审率正常）。锁定在素材疲劳——证据是5秒完播率从48%降到32%，但转化率稳定在13.8%。这说明系统还在找到对的人，但用户不愿意看这个开头了。'这是典型的素材疲劳'是我给出的判断，然后我做了：①换前3秒钩子②做混剪变体③72小时后如果还不恢复就换新方向。结果72小时后换了钩子的版本完播率回到了47%。"'
    },
    v3: {
      label: 'V3 价值展示式（从数据到商业影响）',
      text: '"我分享一个最近做'提前预判素材衰减'的案例。我发现了一条素材的前置指标在恶化——5秒完播率两周内从52%跌到36%，但GMV只降了8%。按照经验，完播率下降会滞后2-4周才反映在GMV上——也就是说，如果我现在不动，4周后GMV可能跌30%。我在第2周就开始测试新的钩子方向了——没有等到GMV真的跌了再反应。结果是换钩子后完播率回到47%，GMV没跌反涨了4%。品牌方都不知道背后发生了什么，只知道'消耗和产出都稳定'。我觉得这就是数据驱动决策的真正价值——不是报数据，而是用数据提前预判风险、提前做动作，让问题在发生之前就被解决。"'
    },
    diff: 'V1在"报数据"——面试官听到了数字但没看到你做了什么。V2展示了诊断逻辑——排除法、交叉验证、三选一的决策框架——面试官看到了你的思考过程。V3最妙的点是"品牌方都不知道"——这句话展示了你的主动性和前瞻性。你是在问题发生之前就解决它的人，而不是问题发生了才被动反应的人。这就是主管和执行的差距。'
  },
  {
    num: 5,
    title: '自我介绍 — "介绍一下你自己"',
    prompt: '面试第一个问题。给你写下来的空间。',
    v1: {
      label: 'V1 简历复读式',
      text: '"我叫范思静，26岁，目前在广州。我做过三份工作：合诚实业做了3年短视频策划、远巨传媒做了4个月内容负责人、故事传媒做了1年多编导组长。策划过1500多条短视频，爆款率35%左右，做过月销千万的产品。"'
    },
    v2: {
      label: 'V2 故事线式',
      text: '"我用了4年时间，完成了一个从设计师助理到信息流项目主管的跃迁。4年前我以设计师助理的身份加入一家大健康品牌，从最基础的修图拍视频做起。3年里，我从执行慢慢深入到内容策略——主动搭建了数据追踪体系，把素材迭代周期从7天压缩到了3天。这段经历让我意识到：相比于做图做视频，我更擅长也更有热情去做'让内容产生商业回报'这件事。所以后两年我转型到代理公司做了内容负责人和项目主管——带团队、定策略、对品牌方结果负责。最近一年最大的成绩，是接手了一个濒死的家清产品，把它做到了月销千万。"'
    },
    v3: {
      label: 'V3 钩子式（面试官听过会记住的版本）',
      text: '"我最擅长做的事就一件——把'跑不动的产品'跑起来。过去四年我验证了三次：第一次是在大健康品牌，我从0搭建内容体系，把一个没有线上存在的品牌拉到搜索率行业前5%。第二次是做女装，用4个月把爆款率从20%拉到35%。第三次是做家清，把一个团队已经放弃的产品从月销不到50万做到了月销千万。这三次经历让我形成了一个信念：信息流内容的本质不是'做出爆款视频'，而是'建立一套让团队持续产出有效内容的系统'。我现在在找下一个可以验证这个方法论的机会。"'
    },
    diff: 'V1的核心问题是"无聊"——任何一个候选人都能复读简历。V2有故事线——4年从设计助理到项目主管的跃迁，给了一个成长轨迹。V3有一个钩子——"把跑不动的产品跑起来"——这是你的差异化标签。面试官一天听10个人自我介绍，唯一能记住的是那个有钩子的。你的钩子是什么？想清楚它，然后每场面试都用它。'
  }
];

document.getElementById('drills').innerHTML = drills.map((d, di) => `
  <div class="drill-card">
    <div class="num">练习 ${d.num}/5</div>
    <h3>${d.title}</h3>
    <div class="prompt">${d.prompt}</div>
    <textarea id="answer-${di}" placeholder="写下你的版本..."></textarea>
    <button class="btn btn-primary" onclick="showResult(${di})">对照优化版本 →</button>
    <div class="result" id="result-${di}">
      <div class="version v1"><div class="v-label">${d.v1.label}</div>${d.v1.text}</div>
      <div class="version v2"><div class="v-label">${d.v2.label}</div>${d.v2.text}</div>
      <div class="version v3"><div class="v-label">${d.v3.label}</div>${d.v3.text}</div>
      <div class="diff"><strong>📊 三段差距分析：</strong>${d.diff}</div>
    </div>
  </div>
`).join('');

function showResult(idx) {
  const result = document.getElementById('result-' + idx);
  result.style.display = 'block';
  result.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
</script>
</body>
</html>
