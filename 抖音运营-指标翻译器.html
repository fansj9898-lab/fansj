<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指标翻译器 · 信息流运营</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0e17; color: #d1d5db; min-height: 100vh; padding: 24px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { text-align: center; font-size: 22px; margin-bottom: 4px; color: #f9fafb; }
  .sub { text-align: center; font-size: 13px; color: #6b7280; margin-bottom: 24px; }

  /* Search/filter */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; font-size: 12px; border: 1px solid #1f2937;
    background: #111827; color: #9ca3af; cursor: pointer; transition: 0.15s;
  }
  .filter-btn:hover, .filter-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

  /* Cards */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .metric-card {
    background: #111827; border: 1px solid #1f2937; border-radius: 12px;
    padding: 22px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
  }
  .metric-card:hover { border-color: #374151; }
  .metric-card.expanded { border-color: #2563eb; grid-column: 1/-1; }

  .metric-card .name { font-size: 18px; font-weight: 800; color: #f9fafb; margin-bottom: 4px; }
  .metric-card .en { font-size: 11px; color: #6b7280; margin-bottom: 10px; }
  .metric-card .summary { font-size: 13px; color: #9ca3af; line-height: 1.6; display: block; }
  .metric-card .detail { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid #1f2937; }

  .metric-card.expanded .detail { display: block; }
  .metric-card.expanded .summary { display: none; }

  .detail-section { margin-bottom: 14px; }
  .detail-section .ds-label {
    font-size: 10px; font-weight: 700; color: #2563eb; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 6px;
  }
  .detail-section p { font-size: 13px; color: #d1d5db; line-height: 1.7; }

  .scenario { background: #0a1628; border-radius: 8px; padding: 12px 16px; margin: 8px 0; font-size: 12px; }
  .scenario .up { color: #22c55e; }
  .scenario .down { color: #ef4444; }

  .linked { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .linked span {
    font-size: 10px; padding: 3px 10px; border-radius: 12px;
    background: #1a1f2e; color: #60a5fa; cursor: pointer;
  }
  .linked span:hover { background: #2563eb; color: #fff; }

  .tag {
    display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 4px;
    margin-right: 4px; font-weight: 600;
  }
  .tag-content { background: #1e3a5f; color: #93c5fd; }
  .tag-cost { background: #451a1a; color: #fca5a5; }
  .tag-revenue { background: #14532d; color: #86efac; }
</style>
</head>
<body>
<div class="container">
  <h1>信息流指标翻译器</h1>
  <div class="sub">点击任意卡片展开 → 每个指标：是什么 · 怎么算 · 涨了说明什么 · 跌了说明什么 · 跟谁联动</div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filter('all')">全部</button>
    <button class="filter-btn" onclick="filter('content')">内容质量</button>
    <button class="filter-btn" onclick="filter('cost')">投放成本</button>
    <button class="filter-btn" onclick="filter('revenue')">收入转化</button>
    <button class="filter-btn" onclick="filter('efficiency')">效率指标</button>
  </div>

  <div class="card-grid" id="grid"></div>
</div>

function renderMetrics(filter) {
  const grid = document.getElementById('grid');
  const filtered = filter === 'all' ? metrics : metrics.filter(m => m.tags.includes(filter));

  grid.innerHTML = filtered.map(m => `
    <div class="metric-card" id="card-${m.id}" data-cat="${m.tags.join(' ')}" onclick="toggleCard('${m.id}')">
      <span class="tag tag-${m.cat}">${m.cat==='content'?'内容质量':m.cat==='cost'?'投放成本':m.cat==='revenue'?'收入转化':'效率指标'}</span>
      <div class="name">${m.name}</div>
      <div class="en">${m.en}</div>
      <div class="summary">${m.summary}</div>
      <div class="detail">
        <div class="detail-section"><div class="ds-label">怎么算</div><p>${m.detail.calc}</p></div>
        <div class="detail-section"><div class="ds-label">健康值</div><p>✅ ${m.detail.good}<br>❌ ${m.detail.bad}</p></div>
        <div class="detail-section" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div><div class="ds-label">📈 涨了说明</div><p>${m.detail.up}</p></div>
          <div><div class="ds-label">📉 跌了说明</div><p>${m.detail.down}</p></div>
        </div>
        ${m.detail.scenario_up ? `<div class="detail-section"><div class="ds-label">🟢 实操场景：涨了</div><div class="scenario">${m.detail.scenario_up}</div></div>` : ''}
        ${m.detail.scenario_down ? `<div class="detail-section"><div class="ds-label">🔴 实操场景：跌了</div><div class="scenario">${m.detail.scenario_down}</div></div>` : ''}
        <div class="detail-section">
          <div class="ds-label">联动指标（点击跳转）</div>
          <div class="linked">${m.detail.linked.map(l => {
            const target = metrics.find(mm => mm.name === l || mm.id === l);
            const display = target ? target.name : l;
            return `<span onclick="event.stopPropagation();jumpToMetric('${l}')">${display}</span>`;
          }).join('')}</div>
        </div>
        <div class="detail-section" style="background:#0a1628;border-radius:8px;padding:12px 16px;">
          <div class="ds-label">💡 一句话记住</div><p style="color:#93c5fd;">${m.detail.tip}</p>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('expanded');
  // Collapse others on mobile
  if (window.innerWidth < 600 && card.classList.contains('expanded')) {
    document.querySelectorAll('.metric-card').forEach(c => {
      if (c.id !== 'card-' + id) c.classList.remove('expanded');
    });
  }
}

function jumpToMetric(name) {
  const target = metrics.find(m => m.name === name || m.id === name);
  if (!target) return;
  const card = document.getElementById('card-' + target.id);
  card.classList.add('expanded');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.style.boxShadow = '0 0 24px rgba(37,99,235,0.4)';
  setTimeout(() => card.style.boxShadow = '', 2000);
}

function filter(cat) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderMetrics(cat);
}

renderMetrics('all');
</script>
</body>
</html>
