<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>范思静 · 工作台</title>
<style>
:root {
  --bg: #f5f1e8;
  --card: #fafaf5;
  --border: #d4cbb8;
  --text: #3a3026;
  --muted: #8c7d6b;
  --accent: #6b5c47;
  --ink: #2c2216;
  --clay: #c4a882;
  --clay-light: #f0e8d8;
  --sage: #6b7f5e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background-color: #f5f1e8;
  color: var(--text);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at 30% 10%, rgba(196,168,130,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 90%, rgba(160,140,110,0.05) 0%, transparent 50%);
}

.app { max-width: 920px; margin: 0 auto; padding: 48px 24px 80px; }

/* ── Hero ── */
.hero {
  display: flex; align-items: center; gap: 24px;
  padding: 0 0 48px; margin-bottom: 44px;
  border-bottom: 1px solid rgba(107,92,71,0.15);
}
.hero-avatar {
  width: 76px; height: 76px; border-radius: 50%; object-fit: cover;
  filter: brightness(0.9) sepia(15%) contrast(1.05);
  border: 2px solid rgba(107,92,71,0.2);
  box-shadow: 0 4px 20px rgba(44,36,22,0.1);
}
.hero-text h1 {
  font-family: "Times New Roman", "Songti SC", "Noto Serif SC", Georgia, serif;
  font-size: 28px; font-weight: 400; letter-spacing: 2.5px; color: var(--ink);
  margin-bottom: 4px;
}
.hero-text .tagline {
  font-size: 14px; color: var(--muted); letter-spacing: 1px; font-style: italic;
}

/* ── Navigation ── */
.nav {
  display: flex; gap: 0; margin-bottom: 44px;
  border-bottom: 1px solid rgba(107,92,71,0.12); padding-bottom: 0;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.nav a {
  font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--muted); text-decoration: none; white-space: nowrap;
  padding: 12px 28px; cursor: pointer;
  transition: all .35s; position: relative;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.nav a::after {
  content: ''; position: absolute; bottom: 6px; left: 28px; right: 28px;
  height: 1px; background: var(--accent); transform: scaleX(0);
  transition: transform .35s ease;
}
.nav a:hover { color: var(--accent); }
.nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
.nav a.on::after { transform: scaleX(1); }

/* ── Section label ── */
.section-label {
  font-size: 9.5px; letter-spacing: 5px; text-transform: uppercase;
  color: var(--muted); margin: 44px 0 18px; opacity: .6;
}

/* ── Card grid ── */
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }

.tool-card {
  background: var(--card);
  border: 1px solid rgba(107,92,71,0.1);
  border-radius: 16px;
  cursor: pointer; transition: all .45s cubic-bezier(.25,.1,.25,1);
  position: relative; overflow: hidden;
}
.tool-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(44,36,22,0.1), 0 2px 6px rgba(44,36,22,0.04);
  border-color: rgba(107,92,71,0.25);
}

/* ── Card image area ── */
.tool-card .card-visual {
  height: 120px; position: relative; overflow: hidden;
  background: linear-gradient(160deg,
    rgba(196,168,130,0.2) 0%,
    rgba(160,140,110,0.1) 40%,
    rgba(107,127,94,0.15) 70%,
    rgba(196,168,130,0.25) 100%
  );
}
.tool-card .card-visual .visual-icon {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  opacity: .35; transition: all .45s cubic-bezier(.25,.1,.25,1);
  color: var(--accent);
}
.tool-card:hover .card-visual .visual-icon { opacity: .6; transform: translate(-50%,-50%) scale(1.1); }

/* Visual variation per card type */
.visual-a { background: linear-gradient(160deg, rgba(196,168,130,0.2), rgba(160,140,110,0.08), rgba(196,168,130,0.2)); }
.visual-b { background: linear-gradient(200deg, rgba(107,127,94,0.15), rgba(180,160,130,0.1), rgba(140,120,90,0.15)); }
.visual-c { background: linear-gradient(140deg, rgba(160,130,100,0.15), rgba(190,170,140,0.1), rgba(150,120,90,0.2)); }

/* ── Card body ── */
.tool-card .card-body { padding: 24px 26px 22px; }
.tool-card .card-body .name {
  font-family: "Times New Roman", "Songti SC", "Noto Serif SC", Georgia, serif;
  font-size: 18px; letter-spacing: 1px; color: var(--ink); margin-bottom: 8px;
  font-weight: 400; transition: color .3s;
}
.tool-card:hover .card-body .name { color: #1a1008; }
.tool-card .card-body .desc { font-size: 12.5px; color: var(--muted); line-height: 1.7; }

/* ── Expand toggle indicator ── */
.tool-card .card-body .toggle-hint {
  display: flex; align-items: center; gap: 8px; margin-top: 14px;
  font-size: 10.5px; color: var(--muted); letter-spacing: 1.5px;
  opacity: 0; transition: opacity .35s;
}
.tool-card:hover .card-body .toggle-hint { opacity: .6; }
.tool-card .card-body .toggle-hint .dot {
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  transition: transform .35s;
}
.tool-card.open .card-body .toggle-hint .dot { transform: rotate(90deg); }

/* ── Card expand panel ── */
.tool-card .card-detail {
  max-height: 0; overflow: hidden; transition: max-height .5s ease, padding .5s ease;
  background: #fdfcf8; border-top: 1px solid rgba(107,92,71,0.08);
  padding: 0 26px;
}
.tool-card.open .card-detail { max-height: 240px; padding: 20px 26px; }
.tool-card.open .card-body .toggle-hint { opacity: .8; }
.tool-card .card-detail p {
  font-size: 12.5px; color: var(--muted); line-height: 1.8; margin-bottom: 12px;
}
.tool-card .card-detail .open-link {
  display: inline-block; font-size: 11.5px; color: var(--accent); text-decoration: none;
  letter-spacing: 2px; border-bottom: 1px solid rgba(107,92,71,0.2); padding-bottom: 4px;
  transition: all .3s;
}
.tool-card .card-detail .open-link:hover { border-bottom-color: var(--accent); padding-bottom: 6px; }

/* ── Doc area ── */
.doc-area {
  background: var(--card); border: 1px solid rgba(107,92,71,0.1);
  border-radius: 16px;
  padding: 48px 40px;
}
.doc-area h3 {
  font-family: "Times New Roman", "Songti SC", "Noto Serif SC", Georgia, serif;
  font-size: 20px; font-weight: 400; letter-spacing: 1.5px; margin-bottom: 8px;
}
.doc-area .hint { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
.doc-area textarea {
  width: 100%; min-height: 170px; background: #fdfcf8; border: 1px solid var(--border);
  color: var(--text); padding: 20px; font-size: 14px; line-height: 1.8;
  font-family: inherit; resize: vertical; -webkit-appearance: none; outline: none;
  transition: border-color .3s;
}
.doc-area textarea:focus { border-color: var(--accent); }
.doc-area textarea::placeholder { color: #c4b99f; }
.doc-area .btn-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.doc-area .btn-o {
  padding: 12px 24px; border: 1px solid var(--border); background: transparent;
  color: var(--accent); font-size: 11.5px; letter-spacing: 1.5px; cursor: pointer;
  transition: all .3s;
}
.doc-area .btn-o:hover { border-color: var(--accent); background: var(--clay-light); }
.doc-area .btn-f {
  padding: 13px 30px; border: none; background: var(--accent);
  color: #fdfcf8; font-size: 11.5px; letter-spacing: 1.5px; cursor: pointer;
  transition: all .3s;
}
.doc-area .btn-f:hover { background: #5a4c38; }
.result-box {
  display: none; margin-top: 24px; padding: 24px; background: #fdfcf8;
  border: 1px solid var(--border); font-size: 13px; line-height: 1.8; color: var(--text);
}
.result-box.show { display: block; }
.result-box h4 {
  font-family: "Times New Roman", "Songti SC", "Noto Serif SC", Georgia, serif;
  font-size: 16px; font-weight: 400; letter-spacing: 1px; margin-bottom: 10px;
}
.result-box .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.result-box .tags span {
  font-size: 10.5px; padding: 3px 10px; background: var(--clay-light); color: var(--accent);
}

/* ── Footer ── */
.footer {
  margin-top: 72px; padding-top: 28px; border-top: 1px solid rgba(107,92,71,0.12);
  font-size: 12px; color: var(--muted); display: flex; justify-content: space-between;
  letter-spacing: .5px;
}
.footer a { color: var(--muted); text-decoration: none; }
.footer a:hover { color: var(--accent); }

@media (max-width: 500px) {
  .app { padding: 28px 14px 60px; }
  .hero { gap: 14px; padding-bottom: 32px; margin-bottom: 28px; }
  .hero-avatar { width: 56px; height: 56px; }
  .hero-text h1 { font-size: 20px; }
  .nav a { padding: 10px 18px; font-size: 11px; letter-spacing: 1.5px; }
  .tool-grid { grid-template-columns: 1fr; gap: 10px; }
  .tool-card .card-visual { height: 80px; }
  .doc-area { padding: 28px 18px; }
}
</style>
</head>
<body>
<div class="app">

<div class="hero">
  <img class="hero-avatar" src="avatar.jpg" alt="">
  <div class="hero-text">

<div class="nav">

<!-- Helper to render a tool card -->
<script>
function makeCard(iconId, visualClass, name, desc, detail, href) {
  return '<div class="tool-card" onclick="location.href=\''+href+'\'" ondblclick="this.classList.toggle(\'open\');event.stopPropagation()">'+
    '<div class="card-visual '+visualClass+'"><svg class="visual-icon" width="48" height="48" viewBox="0 0 44 36"><use href="#'+iconId+'"/></svg></div>'+
    '<div class="card-body"><div class="name">'+name+'</div><div class="desc">'+desc+'</div>'+
    '<div class="toggle-hint"><span class="dot"></span>双击展开详情</div></div>'+
    '<div class="card-detail"><p>'+detail+'</p></div></div>';
}
</script>

<script>
// Card data
var learnCards = [
  ['i1','visual-a','知识闯关','五关二十五题，系统掌握抖音运营核心知识','选择题形式，每关五题，答对四题解锁下一关。涵盖账号定位、内容策略、千川投放、数据复盘、综合实战。','抖音运营-知识闯关.html'],
  ['i2','visual-b','指标翻译器','十个核心指标，展开即看涨跌含义与联动关系','每个指标包含计算方式、健康值范围、涨跌分析、联动指标。五个实操场景教你判断素材衰减与人群饱和。','抖音运营-指标翻译器.html'],
  ['i3','visual-c','算法模拟器','七步拆解抖音算法，从冷启动到流量池跃迁','从视频发布到打标签到逐轮赛马到付费撬动自然流量。每一步都清楚算法在做什么判断。','抖音运营-算法模拟器.html'],
  ['i4','visual-a','商业语言转化器','同一组数据，投手、品牌方、老板三种语言表达','六个真实场景：月度汇报、申请预算、素材卡审、ROI质疑、产品不起量、面试展示。','抖音运营-商业语言转化器.html'],
];
var practiceCards = [
  ['i5','visual-b','数据诊断训练','五个真实场景，看数据写分析，对照专家解读','每个场景给出真实数据表格，自己写分析再对照专业解读。场景数据来自你的渍无踪业务。','抖音运营-数据诊断训练.html'],
  ['i6','visual-c','虚拟操盘模拟','六阶段完整操盘，从接手濒死产品到团队管理','接手诊断→素材测试→预算分配→卡审危机→月度复盘→带人交接。每个决策影响后续数据。','抖音运营-虚拟操盘模拟.html'],
  ['i7','visual-a','话术健身房','五个面试高频题，每道三个版本逐级优化，自动保存','最大项目、管理质疑、跨品类、数据案例、自我介绍。先写再看V1→V2→V3优化版。','抖音运营-话术健身房.html'],
  ['i8','visual-b','AI 对话模拟器','五种身份十六个场景，真实对话练习，自动保存','面试官、品牌方、老板、下属、HR——每轮对话后获得教练反馈。对话记录自动保存。','AI对话模拟器.html'],
];
var toolCards = [
  ['i9','visual-c','简历与作品集','单栏简历及七页作品集，精确版与脱敏版一键切换','渍无踪案例深挖、小白白起量、卡审突破、合诚从0到1、方法论体系。','范思静-面试资料-2026.html'],
  ['i10','visual-a','文档工作台','粘贴任意文档，自动识别类型、拆结构、生成流程','四个模式：分析文档、生成流程、提取数据、格式转换。一键生成下一步建议和AI提示词。','文档工作台.html'],
  ['i1','visual-b','Claude 命令台','触发词速查、核心文件路径、快捷入口','十个触发词对应不同工作流：/投递 /简历 /面试 /深挖 /复盘 /润色 /PDF /提交 /回退。','范思静-工作台.html'],
  ['i6','visual-c','年度规划','12个月职业+学习+健康+财务，分三阶段执行','空窗期→试用期→稳定期，涵盖求职、认证、阅读、运动、睡眠、饮食、存款全维度。','年度规划.html'],
  ['i5','visual-a','对话全记录','性格分析+财务+学习+书单+健康+塑形，全部问答与建议','完整的问答记录与分析报告。忘记细节时来这里回顾状态和决策依据。','范思静-完整对话记录.html'],
  ['i4','visual-b','快速对话','手机电脑同一个网址，打字即存，关掉回来还在','跨设备共享的对话本。想到什么立刻写下来，回头打开还在。电脑写完手机上继续看。','对话.html'],
];

function renderCards(elId, cards) {
  var el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = cards.map(function(c){ return makeCard(c[0],c[1],c[2],c[3],c[4],c[5]); }).join('');
}

// Render all
['g1','g2','g3','g1b','g2b','g3b'].forEach(function(id){
  if (id.startsWith('g1')) renderCards(id, learnCards);
  if (id.startsWith('g2')) renderCards(id, practiceCards);
  if (id.startsWith('g3')) renderCards(id, toolCards);
});

function switchTab(t) {
  document.querySelectorAll('.nav a').forEach(function(a, i){
    var keys = ['all','learn','practice','tools','doc'];
    a.classList.toggle('on', keys[i]===t);
  });
  ['all','learn','practice','tools','doc'].forEach(function(s){
    var el = document.getElementById('sec-'+s);
    if (el) el.style.display = (s===t ? '' : 'none');
  });
}
function analyzeQuick() {
  var text = document.getElementById('quickDoc').value.trim();
  if (!text) return;
  var type = '通用文档';
  if (text.includes('岗位')||text.includes('JD')||text.includes('任职')) type = '岗位 JD';
  else if (text.includes('消耗')||text.includes('ROI')||text.includes('GMV')) type = '投放数据 / 周报';
  else if (text.includes('复盘')||text.includes('总结')) type = '项目复盘';
  var nums=[],m;
  [/(\d+\.?\d*)\s*万/g,/(\d+\.?\d*)\s*%/g,/ROI\s*[：:]\s*(\d+\.?\d*)/gi].forEach(function(p){while((m=p.exec(text))!==null)nums.push(m[0])});
  var r=document.getElementById('quickResult');
  r.className='result-box show';
  r.innerHTML='<h4>识别为：'+type+'</h4>';
  if (nums.length>0) r.innerHTML+='<div class="tags">'+nums.slice(0,12).map(function(n){return'<span>'+n+'</span>'}).join('')+'</div>';
  r.innerHTML+='<p style="margin-top:12px;font-size:13px;">复制此文档到 Claude Code，输入 <em>/复盘</em> 或 <em>/润色</em> 获取深度分析。</p>';
  r.scrollIntoView({behavior:'smooth'});
}
